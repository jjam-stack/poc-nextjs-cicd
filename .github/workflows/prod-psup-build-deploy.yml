name: Deploy to Cloud Run (PROD & PSUP)

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    uses: ./.github/actions/gcp-build-and-deploy.yml@${{ github.ref_name }}
    with:
      environment: prod

  deploy-psup:
    uses: ./.github/actions/gcp-build-and-deploy.yml@${{ github.ref_name }}
    needs: deploy-prod
    with:
      environment: psup