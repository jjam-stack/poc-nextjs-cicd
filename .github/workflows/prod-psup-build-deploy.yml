name: Deploy to Cloud Run (PROD & PSUP)

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    uses: ./.github/workflows/gcp-build-and-deploy.yml@prod
    with:
      environment: prod

  deploy-psup:
    uses: ./.github/workflows/gcp-build-and-deploy.yml@psup
    needs: deploy-prod
    with:
      environment: psup