name: Build and Notify

on:
  pull_request:
    branches:
      - develop
      - sit
      - uat
      - main
    types: 
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment for Production Deploy"
        required: true
        default: "main"

env:
  GCP_PROJECT_NAME: ${{ secrets.GCP_PROJECT_NAME }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      # Notify ClickUp Chat - Success
      - name: Notify ClickUp Chat - Success
        if: success()
        run: |
          curl -X POST "https://api.clickup.com/api/v3/workspaces/${{ secrets.CLICKUP_TEAM_ID }}/chat/channels/${{ secrets.CLICKUP_ROOM_ID }}/messages" \
          -H "Content-Type: application/json" \
          -H "Authorization: ${{ secrets.CLICKUP_API_TOKEN }}" \
          -d '{
                "type": "message",
                "post_data": {
                  "subtype": {
                    "id": "458876",
                    "name": "Update"
                  },
                  "title": "✅ CI Build Passed"
                },
                "content": "* * *\n## ✅ **CI Build Passed**\n\n 📦 **Repository:** ${{ github.repository }}\n 🌱 **Branch:** ${{ github.ref_name }}\n 📝 **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n 🔫 **Triggered by:** ${{ github.actor }}\n\n🔗 [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "notify_all": true
              }'
          
      # Notify ClickUp Chat - Failure
      - name: Notify ClickUp Chat - Failure
        if: failure()
        run: |
          curl -X POST "https://api.clickup.com/api/v3/workspaces/${{ secrets.CLICKUP_TEAM_ID }}/chat/channels/${{ secrets.CLICKUP_ROOM_ID }}/messages" \
          -H "Authorization: ${{ secrets.CLICKUP_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
                "type": "message",
                "post_data": {
                  "subtype": {
                    "id": "458876",
                    "name": "Update"
                  },
                  "title": "❌ CI Build Failed"
                },
                "content": "* * *\n## ❌ **CI Build Failed**\n\n 📦 **Repository:** ${{ github.repository }}\n 🌱 **Branch:** ${{ github.ref_name }}\n 📝 **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n 🔫 **Triggered by:** ${{ github.actor }}\n\n🔗 [View Workflow Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "notify_all": true
              }'

  load-config:
    name: Load Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set ENV
        run: |
          echo "ENV=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "Loading config for ENV=${{ github.ref_name }}"

      - name: Parse ENV file
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq eval '.. | select(tag == "!!str" or tag == "!!int" or tag == "!!bool") 
              | "echo " + (path | join("_")) + "=" + tostring + " >> $GITHUB_ENV"' env/${{ github.ref_name }}.yaml

  gcp-auth:
    name: Authenticate GCP
    runs-on: ubuntu-latest
    needs: load-config
    steps:
      - name: Set up GCP auth
        run: |
          echo "${{ secrets.GCP_SA_KEY_BASE64 }}" | base64 --decode > $HOME/gcp-key.json
          gcloud auth activate-service-account --key-file=$HOME/gcp-key.json
          gcloud config set project $GCP_PROJECT_NAME
          gcloud config set run/region $GCP_REGION
